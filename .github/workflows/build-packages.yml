name: Build Android APK & iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK Licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Release Signing Keystore
        working-directory: android
        run: |
          keytool -genkeypair -v \
            -keystore omnilink-release.jks \
            -alias omnilink \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass omnilink123 \
            -keypass omnilink123 \
            -dname "CN=OmniLink, OU=Bridge, O=OmniLink, L=Shenzhen, S=GD, C=CN"

      - name: Compile Signed Release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/omnilink-release.jks
          KEYSTORE_PASSWORD: omnilink123
          KEY_ALIAS: omnilink
          KEY_PASSWORD: omnilink123
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/OmniLink-Android-v1.0.1.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniLink-Android-APK
          path: dist/OmniLink-Android-v1.0.1.apk
          if-no-files-found: error

  build-ios-ipa:
    name: Build iOS Unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Ensure XcodeGen Installed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode Project via XcodeGen
        working-directory: ios
        run: xcodegen generate

      - name: Build iOS App Bundle (Unsigned for Sideloading)
        working-directory: ios
        run: |
          xcodebuild build \
            -project OmniLink.xcodeproj \
            -scheme OmniLink \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Verify Info.plist Privacy Keys & Ad-hoc Sign for Sideloaders
        working-directory: ios
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/OmniLink.app"
          plutil -p "$APP_PATH/Info.plist"
          plutil -extract NSBluetoothAlwaysUsageDescription raw "$APP_PATH/Info.plist"
          plutil -extract NSLocalNetworkUsageDescription raw "$APP_PATH/Info.plist"
          plutil -extract UIBackgroundModes.0 raw "$APP_PATH/Info.plist"
          codesign --force --sign - --timestamp=none "$APP_PATH"

      - name: Package Payload into IPA
        working-directory: ios
        run: |
          mkdir -p Payload ../dist
          cp -R build/Build/Products/Release-iphoneos/OmniLink.app Payload/OmniLink.app
          zip -qry ../dist/OmniLink-iOS-v1.0.1-unsigned.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniLink-iOS-IPA
          path: dist/OmniLink-iOS-v1.0.1-unsigned.ipa
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release (on Tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-android-apk, build-ios-ipa ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/OmniLink-Android-v1.0.1.apk
            release-assets/OmniLink-iOS-v1.0.1-unsigned.ipa
          generate_release_notes: true
