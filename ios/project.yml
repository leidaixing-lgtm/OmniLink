name: OmniLink
options:
  bundleIdPrefix: com.omnilink
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  OmniLink:
    type: application
    platform: iOS
    sources:
      - path: OmniLink/Sources
      - path: OmniLink/Assets.xcassets
    info:
      path: OmniLink/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omnilink.bridge
        PRODUCT_NAME: OmniLink
        INFOPLIST_FILE: OmniLink/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
