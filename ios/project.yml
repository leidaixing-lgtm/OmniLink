name: OmniLink
options:
  bundleIdPrefix: com.omnilink
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "3"

targets:
  OmniLink:
    type: application
    platform: iOS
    sources:
      - path: OmniLink/Sources
      - path: OmniLink/Assets.xcassets
    info:
      path: OmniLink/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh_CN
        CFBundleDisplayName: 双机互联
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: "用于与您的安卓手机保持低功耗蓝牙连接，实时同步双机通知并控制电话接听"
        NSBluetoothPeripheralUsageDescription: "用于与您的安卓手机建立蓝牙近场配对与通知共享通道"
        NSLocalNetworkUsageDescription: "用于在同一 Wi-Fi 局域网内自动发现并高速连接您的安卓手机"
        NSBonjourServices:
          - "_omnilink._tcp"
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
          - voip
          - audio
          - fetch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omnilink.bridge
        PRODUCT_NAME: OmniLink
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
